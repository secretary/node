name: Monorepo CI

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ synchronize, opened, ready_for_review, reopened ]
        branches: [ master ]


env:
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    GITHUB_TOKEN: ${{ github.token }}
    BASE_BRANCH: ${{ github.event_name == 'pull_request' && 'refs/remotes/origin/master' || github.event.before }}

# Cancel running jobs on subsequent pushes to the same PR or branch.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    install-dependencies:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                node_version:
                    - 20
                    - 22
                    - 24
                    - 26
                architecture:
                    - x64
        name: Node ${{ matrix.node_version }} - ${{ matrix.architecture }} on ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v4
            -   run: corepack enable
            -   uses: actions/setup-node@v4
                with:
                    node-version: ${{ matrix.node_version }}
                    architecture: ${{ matrix.architecture }}
                    cache: 'yarn'
            -   run: yarn install --immutable
            -   name: Run Build
                run: yarn build
            -   name: Run Lint
                run: yarn lint

    ci-lint:
        name: Monorepo CI - Lint
        runs-on: ubuntu-latest
        needs: install-dependencies
        if: github.event_name == 'pull_request'
        steps:
            -   name: Checkout Branch
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            -   run: corepack enable
            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'
                    cache: 'yarn'
            -   name: Install Dependencies
                run: yarn install --immutable
            -   name: Run Build
                run: yarn build
            -   name: Run Lint
                run: yarn lint
            -   name: Run Tests
                run: yarn test
