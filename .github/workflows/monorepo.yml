name: Monorepo CI

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ synchronize, opened, ready_for_review, reopened ]
        branches: [ master ]


env:
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    GITHUB_TOKEN: ${{ github.token }}
    BASE_BRANCH: ${{ github.event_name == 'pull_request' && 'refs/remotes/origin/master' || github.event.before }}

# Cancel running jobs on subsequent pushes to the same PR or branch.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    install-dependencies:
        runs-on: ${{ matrix.os }}
        # Node 26's bundled corepack fails `prepare --activate` on windows
        # (20/22/24 pass with the identical steps). Node 26 is not LTS, so
        # allow just that one combo to fail without blocking CI.
        continue-on-error: ${{ matrix.experimental || false }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                node_version:
                    - 20
                    - 22
                    - 24
                    - 26
                architecture:
                    - x64
                include:
                    -   os: windows-latest
                        node_version: 26
                        architecture: x64
                        experimental: true
        name: Node ${{ matrix.node_version }} - ${{ matrix.architecture }} on ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version: ${{ matrix.node_version }}
                    architecture: ${{ matrix.architecture }}
            -   name: Install, Build & Lint
                shell: bash
                run: |
                    corepack enable
                    corepack prepare yarn@3.4.1 --activate
                    yarn install --immutable
                    yarn build
                    yarn lint

    ci-lint:
        name: Monorepo CI - Lint
        runs-on: ubuntu-latest
        needs: install-dependencies
        if: github.event_name == 'pull_request'
        steps:
            -   name: Checkout Branch
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'
            -   name: Enable Corepack
                run: |
                    corepack enable
                    corepack prepare yarn@3.4.1 --activate
            -   name: Install Dependencies
                run: yarn install --immutable
            -   name: Run Build
                run: yarn build
            -   name: Run Lint
                run: yarn lint
            -   name: Run Tests
                run: yarn test
